<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#002214">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sebastian & Flemy — 9 January 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Alex+Brush&family=Jost:wght@300;400;500;600&family=Cinzel:wght@300;400;500&display=swap&font-display=swap" onload="this.onload=null;this.rel='stylesheet'">

<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════════ */
:root {
  /* Palette — premium royal emerald, ivory, cream, luxury gold */
  --emerald-base: #002214;
  --emerald-gradient: radial-gradient(circle at center, #02482f 0%, #001a0e 100%);
  --ivory-envelope: #fbfaf6;
  --burgundy-wax: #58181f;
  --cream:    #f9f5ee;
  --cream2:   #f3ece0;
  --cream3:   #ece3d2;
  --white:    #fefcf8;
  --sage:     #5a7a5a;
  --sage-lt:  #8aaa8a;
  --sage-dk:  #3a5a3a;
  --sage-pale:#e2ece0;
  --forest:   #1e2e1e;
  --gold:     #b8935a;
  --gold-lt:  #d4ae7a;
  --gold-pale:#f0dfc0;
  --ink:      #1a1208;
  --ink2:     #3a2a10;
  --ink3:     #6a5030;
  --ink4:     #9a7a50;
  --border:   rgba(90,122,90,0.12);
  --border-g: rgba(184,147,90,0.22);

  /* Type */
  --display: 'Playfair Display', serif;
  --script:  'Alex Brush', cursive;
  --body:    'Jost', sans-serif;
  --cinzel:  'Cinzel', serif;

  /* Shadows */
  --s1: 0 1px 8px rgba(30,46,30,.06);
  --s2: 0 4px 24px rgba(30,46,30,.09);
  --s3: 0 12px 48px rgba(30,46,30,.13);
  --s4: 0 24px 80px rgba(30,46,30,.16);

  /* Radii */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
}

/* ══════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:16px; overflow-x:hidden; max-width:100%; }
body {
  background:var(--cream);
  color:var(--ink);
  font-family:var(--body);
  font-weight:300;
  line-height:1.7;
  overflow-x:clip;
  max-width:100vw;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a, a:visited, a:active { text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
img { display:block; max-width:100%; }

/* ══════════════════════════════════════════════
   SCROLL REVEAL
══════════════════════════════════════════════ */
.sr {
  opacity:0;
  transform:translate3d(0, 22px, 0);
  will-change:opacity, transform;
  transition:
    opacity   .6s cubic-bezier(.22,1,.36,1),
    transform .6s cubic-bezier(.22,1,.36,1);
  backface-visibility:hidden;
}
.sr.in {
  opacity:1;
  transform:translate3d(0, 0, 0);
  will-change:auto;
}

.tl-row {
  opacity:0;
  transform:translate3d(-14px, 0, 0);
  will-change:opacity, transform;
  transition:
    opacity   .58s cubic-bezier(.22,1,.36,1),
    transform .58s cubic-bezier(.22,1,.36,1);
  backface-visibility:hidden;
}
.tl-row.in {
  opacity:1;
  transform:translate3d(0, 0, 0);
  will-change:auto;
}
.tl-row.in::before {
  background:var(--sage-lt);
  box-shadow:0 0 0 4px rgba(90,122,90,.15);
  transition:background .4s ease, box-shadow .4s ease;
}

.sr.d1 { transition-delay:.08s; }
.sr.d2 { transition-delay:.15s; }
.sr.d3 { transition-delay:.22s; }
.sr.d4 { transition-delay:.30s; }
.sr.d5 { transition-delay:.38s; }

/* ══════════════════════════════════════════════
   NAV
══════════════════════════════════════════════ */
.nav {
  position:fixed; top:0; left:0; right:0; z-index:900;
  height:56px;
  height:calc(56px + env(safe-area-inset-top, 0px));
  display:flex; align-items:center; justify-content:space-between;
  padding:0 1.5rem;
  background:rgba(249,245,238,.92);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);
  backdrop-filter:blur(10px) saturate(1.3);
  transform:translateZ(0);
  border-bottom:1px solid var(--border);
  transition:filter .25s ease;
}
.nav.up { box-shadow:var(--s2); }
.nav-logo {
  font-family:var(--script);
  font-size:1.75rem; color:var(--forest); line-height:1;
}
.nav-ham {
  display:flex; flex-direction:column; gap:5px;
  background:none; border:none; cursor:pointer; padding:6px;
}
.nav-ham span {
  display:block; width:20px; height:1.5px;
  background:var(--ink2); border-radius:2px; transition:all .28s;
}
.nav-ham.open span:nth-child(1) { transform:rotate(45deg) translate(4.5px,4.5px); }
.nav-ham.open span:nth-child(2) { opacity:0; width:0; }
.nav-ham.open span:nth-child(3) { transform:rotate(-45deg) translate(4.5px,-4.5px); }
.nav-drawer {
  position:fixed; top:56px; left:0; right:0; z-index:899;
  background:var(--white); border-bottom:1px solid var(--border);
  padding:0 1.8rem; flex-direction:column;
  box-shadow:var(--s3);
  max-height:0; overflow:hidden;
  transition:max-height .38s cubic-bezier(.22,1,.36,1),
             padding   .38s cubic-bezier(.22,1,.36,1),
             opacity   .3s ease;
  opacity:0; display:flex;
}
.nav-drawer.open {
  max-height:520px; padding:1.2rem 1.8rem 1.8rem; opacity:1;
}
.nav-drawer a {
  font-size:.7rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink2); padding:.75rem 0; border-bottom:1px solid var(--border);
  transition:color .22s ease, padding-left .22s ease;
}
.nav-drawer a:last-child { border:none; }
.nav-drawer a:hover { color:var(--sage); padding-left:.5rem; }
@media(min-width:768px) {
  .nav-ham { display:none; }
  .nav-drawer {
    display:flex !important; position:static;
    flex-direction:row; padding:0; border:none; background:none; box-shadow:none; gap:2rem;
  }
  .nav-drawer a { padding:0; border:none; font-size:.62rem; }
}

/* ══════════════════════════════════════════════
   HERO — full-page editorial
══════════════════════════════════════════════ */
.hero {
  min-height:100vh; min-height:100svh;
  display:grid;
  grid-template-rows:1fr auto;
  padding-top:56px;
  background:
    radial-gradient(ellipse 70% 55% at 20% 10%,  rgba(90,122,90,.26) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 80%,  rgba(184,147,90,.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 75% 30%,  rgba(90,122,90,.12) 0%, transparent 60%),
    var(--forest);
  position:relative; overflow:clip;
  contain:layout style;
}
.hero-botanical {
  position:absolute; pointer-events:none; z-index:1;
}
.hero-botanical-l {
  bottom:0; left:0;
  width:min(280px,55vw);
  opacity:.22;
}
.hero-botanical-r {
  top:56px; right:0;
  width:min(200px,40vw);
  opacity:.15;
  transform:scaleX(-1) rotate(12deg);
  transform-origin:right top;
  overflow:hidden;
}
.hero-rule-top {
  position:absolute; top:72px; left:5%; right:5%; height:1px;
  background:linear-gradient(to right, transparent, rgba(184,147,90,.3), transparent);
  z-index:2;
}
.hero-body {
  position:relative; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding:3rem 2rem;
  gap:0;
}
.hero-eyebrow {
  font-size:.58rem; font-weight:600; letter-spacing:.5em; text-transform:uppercase;
  color:var(--sage-lt); margin-bottom:1.6rem;
  animation:hIn .9s .15s both;
}
.hero-cross {
  display:flex; align-items:center; gap:1.2rem;
  margin-bottom:1.4rem;
  animation:hIn .9s .25s both;
}
.hero-cross-line {
  flex:1; max-width:55px; height:1px;
  background:linear-gradient(to right, transparent, rgba(184,147,90,.4));
}
.hero-cross-line.r {
  background:linear-gradient(to left, transparent, rgba(184,147,90,.4));
}
.hero-names {
  animation:hIn .9s .35s both;
  line-height:1;
}
.hero-name-script {
  font-family:var(--script);
  font-size:clamp(4rem,14vw,8rem);
  color:var(--cream);
  display:block; line-height:1.05;
}
.hero-amp {
  font-family:var(--script);
  font-size:clamp(2.5rem,9vw,5rem);
  color:var(--gold-lt);
  display:block; line-height:.9;
  margin:.05em 0;
}
.hero-orn {
  display:flex; align-items:center; gap:.8rem;
  margin:1.8rem 0 1.6rem;
  max-width:260px; width:100%;
  animation:hIn .9s .45s both;
}
.hero-orn-line { flex:1; height:1px; background:rgba(184,147,90,.3); }
.hero-orn-nodes { display:flex; align-items:center; gap:.38rem; }
.hero-orn-dot { width:3px; height:3px; border-radius:50%; background:var(--gold-lt); opacity:.7; }
.hero-orn-star { font-size:.65rem; color:var(--gold-lt); line-height:1; opacity:.8; }
.hero-date {
  animation:hIn .9s .55s both;
  margin-bottom:1.8rem;
}
.hero-date-main {
  font-family:var(--display);
  font-size:clamp(.95rem,3vw,1.3rem);
  font-weight:400; font-style:italic;
  color:rgba(249,245,238,.85);
  letter-spacing:.08em;
}
.hero-date-sub {
  font-size:.58rem; font-weight:500; letter-spacing:.28em; text-transform:uppercase;
  color:var(--sage-lt); margin-top:.3rem;
}
.hero-verse {
  font-family:var(--display);
  font-style:italic; font-weight:400;
  font-size:clamp(.85rem,2.5vw,1rem);
  color:rgba(234,228,218,.65);
  line-height:1.9; max-width:280px;
  border-top:1px solid rgba(90,122,90,.2);
  padding-top:1.6rem;
  animation:hIn .9s .65s both;
}
.hero-verse cite {
  display:block; font-style:normal;
  font-size:.5rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  color:var(--sage-lt); margin-top:.5rem; opacity:.7;
}

.hero-countdown {
  position:relative; z-index:3;
  border-top:1px solid rgba(90,122,90,.2);
  padding:1.8rem 2rem;
  display:flex; flex-direction:column; align-items:center; gap:1.2rem;
}
.hero-cd-label {
  font-size:.52rem; font-weight:600; letter-spacing:.4em; text-transform:uppercase;
  color:rgba(138,170,138,.55);
}
.hero-cd-row {
  display:flex; align-items:center; gap:0;
}
.hero-cd-unit {
  display:flex; flex-direction:column; align-items:center;
  padding:0 clamp(.8rem,3vw,1.8rem);
  position:relative;
}
.hero-cd-unit:not(:last-child)::after {
  content:'·';
  position:absolute; right:0; top:50%;
  transform:translateY(-58%);
  font-family:var(--display);
  font-size:1.4rem; color:rgba(184,147,90,.2); line-height:1;
}
.hero-cd-l {
  font-size:.44rem; font-weight:600; letter-spacing:.25em; text-transform:uppercase;
  color:rgba(138,170,138,.4); margin-top:.35rem;
}
@keyframes cdFlip {
  0%   { opacity:0;    transform:translate3d(0,-12px,0) scale(.95); }
  40%  { opacity:1;    transform:translate3d(0, 3px,0) scale(1.02); }
  100% { opacity:.78;  transform:translate3d(0, 0, 0)  scale(1);    }
}
@keyframes hIn {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:none; }
}

/* ══════════════════════════════════════════════
   SECTION SHELL
══════════════════════════════════════════════ */
.sec { padding:5.5rem 1.5rem; contain:content; }
.sec-sm { padding:4rem 1.5rem; }
.sec-inner { max-width:720px; margin:0 auto; text-align:left; }
@media(min-width:768px) { .sec-inner { text-align:center; } }

.eyebrow {
  display:block; text-align:center;
  font-size:.56rem; font-weight:600; letter-spacing:.42em; text-transform:uppercase;
  color:var(--sage); margin-bottom:.55rem;
}
.title {
  font-family:var(--display); font-weight:400;
  font-size:clamp(1.9rem,5.5vw,2.8rem);
  color:var(--forest); text-align:center; line-height:1.18;
  margin-bottom:.5rem;
}
.title em { font-style:italic; color:var(--sage); font-weight:400; }
.title-dk { color:rgba(249,245,238,.9); }
.title-dk em { color:var(--gold-lt); }

.orn {
  display:flex; align-items:center; justify-content:center;
  gap:.7rem; margin:1.1rem auto 3rem;
}
.orn-line { width:40px; height:1px; background:var(--border-g); }
.orn-nodes { display:flex; align-items:center; gap:.3rem; }
.orn-dot { width:3.5px; height:3.5px; border-radius:50%; background:var(--gold-lt); opacity:.6; }
.orn-dia { width:5.5px; height:5.5px; background:var(--gold-lt); transform:rotate(45deg); opacity:.7; }

/* ══════════════════════════════════════════════
   BENTO EVENT DESIGN
══════════════════════════════════════════════ */
.events-sec { background:var(--cream2); }
.ev-container { max-width:680px; margin:0 auto; }
.ev-cols { display:grid; grid-template-columns:1fr; gap:1.2rem; margin-top:2rem; }
@media(min-width:600px) { .ev-cols { grid-template-columns:1fr 1fr; } }

.ev-date-hero {
  display:inline-flex; align-items:center; gap:1.2rem;
  margin:0 auto 2.2rem; text-align:center; justify-content:center; width:100%;
}
.ev-date-block { display:flex; flex-direction:column; align-items:center; }
.ev-date-num { font-family:var(--display); font-size:2.8rem; line-height:1; color:var(--forest); }
.ev-date-month { font-size:.5rem; font-weight:600; letter-spacing:.25em; text-transform:uppercase; color:var(--sage); margin-top:.2rem; }
.ev-date-year { font-size:.65rem; font-weight:400; color:var(--ink3); letter-spacing:.1em; }
.ev-date-sep { font-family:var(--display); font-style:italic; font-size:1.8rem; color:var(--gold-lt); opacity:.55; line-height:1; align-self:center; }

.ev-day-badge {
  display:inline-block; margin-bottom:2rem; background:var(--sage-pale); color:var(--sage-dk);
  font-size:.6rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  padding:.38rem 1.1rem; border-radius:30px; border:1px solid rgba(90,122,90,.2);
}
.ev-day-badge-dk { background:rgba(90,122,90,.12); border-color:rgba(90,122,90,.15); }

.ev-card {
  background:var(--white); border-radius:var(--r-md); overflow:hidden;
  box-shadow:var(--s1); border:1px solid var(--border);
  display:flex; flex-direction:column; transform:translateZ(0);
}
.ev-card:hover { transform:translate3d(0,-2px,0); box-shadow:var(--s3); }
.ev-card-strip { height:3px; background:linear-gradient(to right, var(--sage), var(--gold-lt)); }
.ev-card-head { padding:1.2rem 1.4rem .8rem; display:flex; align-items:center; gap:.9rem; border-bottom:1px solid rgba(30,46,30,.04); }
.ev-card-icon { font-size:1.4rem; line-height:1; }
.ev-card-title { font-family:var(--display); font-size:1.18rem; font-style:italic; color:var(--forest); }
.ev-card-time { font-size:.58rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); margin-top:.15rem; }
.ev-card-body { padding:1.2rem 1.4rem; flex:1; display:flex; flex-direction:column; justify-content:between; gap:1.2rem; }
.ev-card-venue { font-size:.85rem; color:var(--ink2); line-height:1.65; }
.ev-map-btn {
  align-self:start; display:inline-flex; align-items:center; gap:.4rem;
  font-size:.56rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--sage-dk); border:1.2px solid rgba(90,122,90,.4);
  padding:.5rem .9rem; border-radius:30px; background:transparent;
  transition:all .22s ease;
}
.ev-map-btn:hover { background:var(--sage-pale); border-color:var(--sage); }

/* ══════════════════════════════════════════════
   FAMILIES
══════════════════════════════════════════════ */
.fam-sec { background:var(--forest); position:relative; overflow:hidden; }
.fam-sec::before {
  content:''; position:absolute; width:60vw; height:60vw; max-width:500px; max-height:500px;
  border-radius:50%; top:-20%; right:-15%; background:radial-gradient(circle, rgba(90,122,90,.2) 0%, transparent 70%); pointer-events:none;
}
.fam-sec .eyebrow { color:rgba(138,170,138,.6); }
.fam-sec .orn-line { background:rgba(184,147,90,.2); }
.fam-sec .orn-dot,.fam-sec .orn-dia { background:var(--gold-lt); }

.fam-grid { display:grid; grid-template-columns:1fr; gap:14px; max-width:720px; margin:0 auto; }
@media(min-width:560px) { .fam-grid { grid-template-columns:1fr 1fr; } }

.fam-card {
  background:rgba(255,252,245,.05); border:1px solid rgba(90,122,90,.2);
  border-radius:var(--r-md); padding:2rem 1.8rem; cursor:pointer; transform:translateZ(0);
  transition:background .3s ease, border-color .3s ease, transform .25s ease;
}
.fam-card:hover { background:rgba(255,252,245,.08); border-color:rgba(184,147,90,.25); }
.fam-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
.fam-badge { font-size:.52rem; font-weight:600; letter-spacing:.26em; text-transform:uppercase; color:rgba(138,170,138,.6); margin-bottom:.55rem; }
.fam-name { font-family:var(--display); font-style:italic; font-weight:400; font-size:1.5rem; color:rgba(249,245,238,.9); line-height:1.1; }
.fam-chevron {
  width:28px; height:28px; border-radius:50%; flex-shrink:0; margin-top:.3rem;
  background:rgba(255,252,245,.08); border:1px solid rgba(184,147,90,.2);
  display:flex; align-items:center; justify-content:center; transition:all .42s cubic-bezier(.22,1,.36,1);
}
.fam-card.open .fam-chevron { transform:rotate(180deg); background:rgba(184,147,90,.15); }
.fam-detail { font-size:.82rem; color:rgba(234,228,218,.7); line-height:2.05; margin-top:.9rem; }
.fam-detail strong { color:rgba(249,245,238,.88); font-weight:500; }
.fam-expand { max-height:0; overflow:hidden; transition:max-height .55s cubic-bezier(.22,1,.36,1), opacity .45s ease; opacity:0; }
.fam-card.open .fam-expand { max-height:600px; opacity:1; }
.fam-expand-inner { padding-top:1.4rem; }
.fam-members { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin-bottom:1rem; }
.fam-member { text-align:center; }
.fam-photo {
  width:100%; aspect-ratio:1; border-radius:50%; background:rgba(255,252,245,.06); border:1px dashed rgba(184,147,90,.28);
  display:flex; align-items:center; justify-content:center; margin:0 auto .45rem; overflow:hidden;
}
.fam-photo svg { opacity:.3; }
.fam-photo img { width:100%; height:100%; object-fit:cover; }
.fam-member-name { font-size:.7rem; color:rgba(234,228,218,.7); line-height:1.3; }
.fam-member-role { font-size:.55rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(184,147,90,.45); }
.fam-hint { font-size:.62rem; font-style:italic; color:rgba(184,147,90,.35); text-align:center; padding:.55rem; border:1px dashed rgba(184,147,90,.18); border-radius:6px; }

/* ══════════════════════════════════════════════
   DRESS CODE
══════════════════════════════════════════════ */
.dress-sec { background:var(--cream3); }
.dress-grid { display:grid; grid-template-columns:1fr; gap:12px; max-width:720px; margin:0 auto; }
@media(min-width:560px) { .dress-grid { grid-template-columns:1fr 1fr; } }
.dc { background:var(--white); border-radius:var(--r-md); padding:1.8rem 1.6rem; border-left:3px solid var(--sage-pale); transition:all .3s; }
.dc:hover { border-left-color:var(--sage); transform:translate3d(0,-1px,0); }
.dc-ev { font-size:.52rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--sage); margin-bottom:.45rem; }
.dc-ti { font-family:var(--display); font-size:1.15rem; font-weight:500; color:var(--forest); margin-bottom:.55rem; }
.dc-de { font-size:.85rem; color:var(--ink2); line-height:1.82; }

/* ══════════════════════════════════════════════
   FAITH
══════════════════════════════════════════════ */
.faith-sec { background:var(--forest); text-align:center; padding:5.5rem 1.5rem; position:relative; overflow:clip; contain:content; }
.faith-sec::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 50%, rgba(90,122,90,.22) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 50%, rgba(184,147,90,.12) 0%, transparent 60%);
}
.faith-inner { position:relative; z-index:1; max-width:600px; margin:0 auto; }
.faith-sec .orn-line { background:rgba(184,147,90,.18); }
.faith-sec .orn-dot,.faith-sec .orn-dia { background:var(--gold-lt); opacity:.6; }
.faith-cross { display:block; margin:0 auto 2.2rem; }
.faith-verse { font-family:var(--display); font-style:italic; font-weight:400; font-size:clamp(1.15rem,4vw,1.8rem); line-height:1.8; color:rgba(249,245,238,.88); margin-bottom:.85rem; }
.faith-cite { font-size:.58rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:rgba(138,170,138,.55); }
.faith-church { margin-top:2.5rem; padding-top:2.2rem; border-top:1px solid rgba(90,122,90,.18); font-size:.86rem; color:rgba(234,228,218,.62); line-height:2; }
.faith-church strong { display:block; font-family:var(--display); font-style:italic; font-weight:400; font-size:1.05rem; color:rgba(249,245,238,.88); margin-bottom:.25rem; }

/* ══════════════════════════════════════════════
   RSVP
══════════════════════════════════════════════ */
.rsvp-sec { background:var(--cream2); }
.rsvp-card { max-width:480px; margin:0 auto; background:var(--white); border-radius:var(--r-xl); padding:2.5rem 2.2rem; box-shadow:var(--s3); border:1px solid var(--border); }
.fg { margin-bottom:1.3rem; }
.fl { display:block; font-size:.56rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--sage); margin-bottom:.45rem; }
.fi, .fs { width:100%; padding:.78rem .95rem; border:1.5px solid var(--border); background:var(--cream); border-radius:var(--r-sm); font-family:var(--body); font-size:.88rem; font-weight:400; color:var(--ink); transition:border-color .2s; }
.fi:focus, .fs:focus { outline:none; border-color:var(--sage-lt); background:var(--white); }
.fs { appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none' stroke='%235a7a5a' stroke-width='1.5'><polyline points='1,1 5,5 9,1'/></svg>"); background-repeat:no-repeat; background-position:right 1.1rem center; background-size:10px 6px; padding-right:2.5rem; }
.fb {
  width:100%; padding:.9rem; margin-top:.8rem; background:var(--forest); color:rgba(249,245,238,.9);
  font-family:var(--body); font-size:.65rem; font-weight:600; letter-spacing:.32em; text-transform:uppercase;
  border:none; border-radius:30px; cursor:pointer; transform:translateZ(0); transition:all .25s ease;
}
.fb:hover { background:var(--sage-dk); box-shadow:0 6px 22px rgba(58,90,58,.3); transform:translate3d(0,-1px,0); }
.fb:active { transform:scale(.98); }
.rsvp-msg { margin-top:1.1rem; font-size:.78rem; text-align:center; font-weight:400; display:none; }
.rsvp-msg.success { color:var(--sage-dk); display:block; }
.rsvp-msg.error { color:#a44; display:block; }

/* ══════════════════════════════════════════════
   FOOTER
══════════════════════════════════════════════ */
.footer { background:var(--white); padding:4.5rem 1.5rem; text-align:center; border-top:1px solid var(--border); position:relative; }
.footer-logo { font-family:var(--script); font-size:2.8rem; color:var(--forest); line-height:1; margin-bottom:.6rem; }
.footer-tag { font-size:.56rem; font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); margin-bottom:2rem; }
.footer-credit { font-size:.6rem; font-weight:400; color:var(--ink4); letter-spacing:.05em; border-top:1px solid rgba(30,46,30,.05); display:inline-block; padding-top:1.5rem; width:100%; max-width:240px; }

/* ── Contact buttons ── */
.cc-row { display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; margin-bottom:2.2rem; }
.cc-link {
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.62rem .95rem;
  border:1px solid rgba(184,147,90,.28); border-radius:30px; font-size:.6rem; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; background:transparent; color:var(--ink2); transition:all .24s;
}
.cc-link:hover { background:var(--cream2); border-color:var(--gold); }

/* ── Link hover underline slide ── */
.nav-drawer a { position:relative; }
.nav-drawer a::after { content:''; position:absolute; bottom:-1px; left:0; width:0; height:1px; background:var(--sage); transition:width .28s cubic-bezier(.22,1,.36,1); }
.nav-drawer a:hover::after { width:100%; }

.hero-cd-n { display: block; font-family: var(--display); font-size: clamp(2.4rem, 9vw, 3.2rem); font-weight: 400; color: rgba(249,245,238,.90); line-height: 1; min-height: 1.1em; will-change: transform, opacity; }
.hero-cd-n.flip { animation: cdLeave .18s cubic-bezier(.25, 1, .5, 1) forwards; }
.hero-cd-n.enter { animation: cdEnter .24s cubic-bezier(.25, 1, .5, 1) forwards; }
@keyframes cdLeave { 0% { opacity: .78; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-14px); } }
@keyframes cdEnter { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: .9; transform: translateY(0); } }

/* ══════════════════════════════════════════════
   PREMIUM LANDING ENVELOPE OVERLAY OVERRIDES (1000160421.png)
══════════════════════════════════════════════ */
.env-overlay {
  position:fixed; inset:0; z-index:9999;
  background:var(--emerald-gradient);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  overflow:hidden; touch-action:none;
  transition:opacity .75s cubic-bezier(.4, 0, .2, 1), visibility .75s;
}
.env-overlay.env-hidden {
  opacity:0; visibility:hidden; pointer-events:none;
}

/* Luxury Line Art Corner Botanicals on Landing Screen */
.env-decorations {
  position:absolute; inset:0; pointer-events:none; z-index:1;
}
.env-decorations::before, .env-decorations::after {
  content:""; position:absolute; width:220px; height:220px; opacity:0.18;
  background-size:contain; background-repeat:no-repeat;
}
.env-decorations::before {
  top:20px; left:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23d4ae7a' stroke-width='0.5'><path d='M0,0 Q40,10 50,50 Q10,40 0,0 Z M0,0 Q60,5 80,30 M0,0 Q5,60 30,80 M20,20 Q45,25 40,50 M20,20 Q25,45 50,40'/></svg>");
}
.env-decorations::after {
  bottom:20px; right:20px; transform:rotate(180deg);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23d4ae7a' stroke-width='0.5'><path d='M0,0 Q40,10 50,50 Q10,40 0,0 Z M0,0 Q60,5 80,30 M0,0 Q5,60 30,80 M20,20 Q45,25 40,50 M20,20 Q25,45 50,40'/></svg>");
}

/* Minimal Royal Instruction Typography */
.env-instruction-text {
  font-family:var(--cinzel);
  color:var(--gold-lt);
  font-size:0.75rem;
  letter-spacing:0.35em;
  margin-bottom:1.8rem;
  text-transform:uppercase;
  font-weight:300;
  opacity:0.85;
  text-shadow:0px 2px 5px rgba(0,0,0,0.4);
  z-index:2;
  text-align:center;
}

/* Main Interactive Container */
.env-card-wrapper {
  position:relative; z-index:2;
  perspective:1200px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  transition:transform 0.4s cubic-bezier(.22,1,.36,1);
}
.env-card-wrapper:hover {
  transform:scale(1.02);
}

/* Faux Embossed Fine Paper Envelope Exterior Base */
.env-envelope-base {
  position:relative;
  width:min(440px, 90vw);
  aspect-ratio:3 / 2;
  background-color:var(--ivory-envelope);
  border-radius:4px;
  box-shadow:0 25px 55px rgba(0, 0, 0, 0.45), inset 0 0 15px rgba(0,0,0,0.03);
  overflow:hidden;
}

/* Delicate Faux-Embossed Watermark Leaf Accents */
.env-embossed-pattern {
  position:absolute; width:100px; height:100px; opacity:0.04; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000000'><path d='M17,8C15.31,8 13.03,9.5 12,11.5C10.97,9.5 8.69,8 7,8C4.5,8 3,9.5 3,11.5C3,14.5 7,18 12,21C17,18 21,14.5 21,11.5C21,9.5 19.5,8 17,8Z'/></svg>");
  background-size:contain; background-repeat:no-repeat;
}
.env-embossed-pattern.top-left { top:15px; left:15px; transform:rotate(-15deg); }
.env-embossed-pattern.bottom-right { bottom:15px; right:15px; transform:rotate(165deg); }

/* Faux Angular Geometric Fold Line Overlays */
.env-fold-flap {
  position:absolute; inset:0; pointer-events:none;
}
.env-fold-flap::before {
  content:""; position:absolute; top:0; left:0; width:100%; height:100%;
  border-left:calc(440px / 2 * 0.9) solid transparent;
  border-right:calc(440px / 2 * 0.9) solid transparent;
  border-top:calc(440px * 0.3) solid rgba(0, 0, 0, 0.035);
}

/* 3D Realism Glossy Burgundy Wax Seal */
.env-wax-seal-btn {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%, -50%);
  width:88px; height:88px;
  background:radial-gradient(circle at 35% 35%, #7e222b, var(--burgundy-wax) 65%, #2c0b0e 100%);
  border-radius:52% 48% 51% 49% / 49% 52% 48% 51%; /* Organic wax stamp deformity */
  box-shadow:0 10px 24px rgba(0, 0, 0, 0.55), inset -4px -4px 10px rgba(0,0,0,0.65), inset 4px 4px 10px rgba(255,255,255,0.22);
  display:flex; justify-content:center; align-items:center;
  border:2px solid var(--burgundy-wax);
  z-index:10;
}
.env-seal-inner {
  width:64px; height:64px; border-radius:50%;
  border:1.5px solid rgba(0, 0, 0, 0.18);
  background:radial-gradient(circle at 35% 35%, #6b1d26, #3f1014 90%);
  display:flex; justify-content:center; align-items:center;
  box-shadow:inset 0 4px 6px rgba(0,0,0,0.45);
}

/* Elegant Cursive Script Metallic Crest Initials */
.env-seal-initials {
  font-family:var(--script);
  color:var(--gold-lt);
  font-size:2.1rem;
  font-weight:bold;
  letter-spacing:-1px;
  text-shadow:1px 1px 0px #fff8db, -1px -1px 1px #5c4308;
  user-select:none;
}

/* Subtle Animated Bounce Arrow Indicator */
.env-down-arrow-indicator {
  margin-top:2rem; width:12px; height:12px;
  border-right:1.5px solid var(--gold-lt);
  border-bottom:1.5px solid var(--gold-lt);
  transform:rotate(45deg); opacity:0.65;
  animation:envArrowBounce 2s ease-in-out infinite;
}
@keyframes envArrowBounce {
  0%, 20%, 50%, 80%, 100% { transform:translateY(0) rotate(45deg); }
  40% { transform:translateY(-8px) rotate(45deg); }
  60% { transform:translateY(-4px) rotate(45deg); }
}

/* Opening Animation Sequencer Triggers */
.env-opening .env-wax-seal-btn {
  transform:translate(-50%, -50%) scale(0.7); opacity:0;
  transition:transform 0.4s cubic-bezier(.4, 0, 1, 1), opacity 0.35s ease;
}
.env-opening .env-envelope-base {
  transform:scale(0.9) translate3d(0, 600px, 0); opacity:0;
  transition:transform 0.9s cubic-bezier(.6, -0.28, .735, .045), opacity 0.8s ease;
}
.env-opening .env-instruction-text, .env-opening .env-down-arrow-indicator {
  opacity:0; transform:translateY(-20px);
  transition:all 0.5s ease;
}
</style>
</head>
<body>

<div class="env-overlay" id="envOverlay">
  <div class="env-decorations"></div>
  
  <div class="env-card-wrapper" id="envCardContainer">
    <p class="env-instruction-text">TAP THE ENVELOPE TO OPEN</p>
    
    <div class="env-envelope-base">
      <div class="env-embossed-pattern top-left"></div>
      <div class="env-embossed-pattern bottom-right"></div>
      <div class="env-fold-flap"></div>
      
      <div class="env-wax-seal-btn">
        <div class="env-seal-inner">
          <span class="env-seal-initials">SF</span>
        </div>
      </div>
    </div>
    
    <div class="env-down-arrow-indicator"></div>
  </div>
</div>
